[project]
name = "frameforge-backend"
version = "0.1.0"
description = "FrameForge AI — video automation API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
